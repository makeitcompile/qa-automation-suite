name: Run Tests

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: browser-actions/setup-chrome@v1
      - name: Run tests
        run: ./gradlew test -Dheadless=true
        continue-on-error: true